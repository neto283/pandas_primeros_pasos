name: Ejecutar notebook de Pandas

on:
  push:
    paths:
      - '.github/workflows/execute-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      - name: Ejecutar y guardar notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=600 \
            1_primeros_pasos_con_Pandas.ipynb

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1_primeros_pasos_con_Pandas.ipynb
          if git diff --cached --quiet; then
            echo "El notebook ya estaba actualizado."
          else
            git commit -m "Actividad Pandas: notebook ejecutado [skip ci]"
            git push
          fi
